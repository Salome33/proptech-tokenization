server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:proptechdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-dev-only-change-me-please}
    expirationMs: ${JWT_EXP_MS:86400000}

