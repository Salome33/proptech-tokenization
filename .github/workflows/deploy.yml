name: Deploy PropTech API to Cloud Run

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SERVICE_NAME: proptech-tokenization
      REGION: us-central1
      GAR_LOCATION: us-central1
      GAR_REPOSITORY: proptech-apis
      IMAGE_NAME: proptech-tokenization

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Diagnóstico: evita “adivinar” qué ve el runner tras checkout
      - name: Diagnóstico (árbol y pom.xml)
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -name pom.xml -print || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            proptech-tokenization/backend/pom.xml

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          if [[ -f "$ROOT/backend/pom.xml" ]]; then
            echo "Maven en: backend/"
            (cd "$ROOT/backend" && mvn test)
          elif [[ -f "$ROOT/proptech-tokenization/backend/pom.xml" ]]; then
            echo "Maven en: proptech-tokenization/backend/"
            (cd "$ROOT/proptech-tokenization/backend" && mvn test)
          else
            echo "::error::No hay pom.xml en backend/ ni en proptech-tokenization/backend/"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          if [[ -f "$ROOT/backend/pom.xml" ]]; then
            BACK="$ROOT/backend"
          elif [[ -f "$ROOT/proptech-tokenization/backend/pom.xml" ]]; then
            BACK="$ROOT/proptech-tokenization/backend"
          else
            echo "::error::No hay Dockerfile context"
            exit 1
          fi
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          (cd "$BACK" && docker build -t "$IMAGE_URI" .)
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE_URI" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "JWT_EXP_MS=86400000,JWT_SECRET=${{ secrets.JWT_SECRET }}"

      - name: Smoke test /api/proptech/ping (expects 401/403)
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format 'value(status.url)')"
          CODE="$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/proptech/ping")"
          if [[ "$CODE" == "401" || "$CODE" == "403" ]]; then
            echo "OK: protected endpoint returned $CODE"
          else
            echo "Unexpected status: $CODE"
            exit 1
          fi
