name: Deploy PropTech API to Cloud Run

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SERVICE_NAME: proptech-tokenization
      REGION: us-central1
      GAR_LOCATION: us-central1
      GAR_REPOSITORY: proptech-apis
      IMAGE_NAME: proptech-tokenization

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend folder exists
        run: |
          ls -la
          test -d backend || { echo "::error::No existe la carpeta backend/ en el repo. En tu PC ejecuta: git add backend frontend && git commit && git push"; exit 1; }
          ls -la backend

      - name: Run backend tests
        run: mvn test
        working-directory: backend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
        working-directory: backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE_URI" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "JWT_EXP_MS=86400000,JWT_SECRET=${{ secrets.JWT_SECRET }}"

      - name: Smoke test /api/proptech/ping (expects 401/403)
        run: |
          URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format 'value(status.url)')"
          CODE="$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/proptech/ping")"
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "OK: protected endpoint returned $CODE"
          else
            echo "Unexpected status: $CODE"
            exit 1
          fi

